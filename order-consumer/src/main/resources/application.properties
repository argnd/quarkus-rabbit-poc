quarkus.application.name=order-consumer
quarkus.http.port=8080

# Connexion au broker (définir les variables d'environnement hors local)
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Le broker local vient de docker-compose.yml, pas des Dev Services
quarkus.rabbitmq.devservices.enabled=false

# Base partagée par toutes les instances.
# Pas de connection-string en test : les Dev Services démarrent alors un MongoDB dans Docker.
quarkus.mongodb.database=orders
%dev.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}

# Canal entrant "orders"
mp.messaging.incoming.orders.connector=smallrye-rabbitmq
mp.messaging.incoming.orders.exchange.name=orders
mp.messaging.incoming.orders.exchange.type=topic
mp.messaging.incoming.orders.routing-keys=order.created
mp.messaging.incoming.orders.queue.name=orders.created
mp.messaging.incoming.orders.queue.durable=true
# Plafond de messages non acquittés par instance : le reste attend dans la queue, pour les autres instances
mp.messaging.incoming.orders.max-outstanding-messages=10

# Message en échec : rejeté puis routé vers la dead-letter queue
mp.messaging.incoming.orders.failure-strategy=reject
mp.messaging.incoming.orders.auto-bind-dlq=true
mp.messaging.incoming.orders.dead-letter-exchange=orders.dlx
mp.messaging.incoming.orders.dead-letter-queue-name=orders.created.dlq
