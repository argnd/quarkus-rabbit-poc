# Exemple à valeurs factices : ne pas y mettre de vrais identifiants, ne pas appliquer tel quel.
apiVersion: v1
kind: Secret
metadata:
  name: order-consumer-secrets
type: Opaque
stringData:
  RABBITMQ_USERNAME: CHANGE_ME
  RABBITMQ_PASSWORD: CHANGE_ME
  MONGODB_URI: mongodb://CHANGE_ME:CHANGE_ME@mongodb.example.svc.cluster.local:27017
  # Lu par KEDA uniquement, pour interroger la taille de la queue
  RABBITMQ_AMQP_URL: amqp://CHANGE_ME:CHANGE_ME@rabbitmq.example.svc.cluster.local:5672/
